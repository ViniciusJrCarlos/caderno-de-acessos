<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1B365D">
<title>Caderno de Acessos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caderno">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="travado">
<section id="login" class="login">
  <form id="loginForm" class="login-box" autocomplete="off">
    <h1>Caderno de Acessos</h1>
    <input id="loginSenha" type="password" placeholder="Senha de acesso" autocomplete="current-password" aria-label="Senha de acesso">
    <button type="submit" id="loginBtn">Abrir caderno</button>
    <p id="loginErro" class="login-erro" role="alert"></p>
    <p class="login-rodape" id="loginRodape">Caderno de Acessos v1.0 · © Todos os direitos reservados · Desenv. WebDev</p>
  </form>
</section>
<div id="app">
<header>
  <h1>Caderno de Acessos</h1>
  <p id="sub">Equipe · offline neste aparelho</p>
</header>
<div class="chips" id="chips"></div>
<input id="busca" placeholder="Buscar portal, cliente, URL">
<main id="lista"></main>
<button class="fab" id="novo" type="button">+</button>
<nav class="nav">
  <button type="button" data-aba="equipe" class="on">Equipe</button>
  <button type="button" data-aba="meu">Meus</button>
  <button type="button" data-aba="vencendo">Vencendo</button>
  <button type="button" data-aba="arquivo">Arquivo</button>
  <button type="button" data-aba="mais">Mais</button>
</nav>
<div class="sheet" id="sheet">
  <div class="panel">
    <h3 id="fichaTitulo">Novo acesso</h3>
    <div id="campos"></div>
    <div class="botoes">
      <button type="button" id="ciclo">Troca = hoje</button>
      <button type="button" id="salvar" class="pri">Salvar</button>
      <button type="button" id="fechar">Fechar</button>
    </div>
  </div>
</div>
</div>
<script src="js/app.js"></script>
</body>
</html>
